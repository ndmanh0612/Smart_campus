name: smartcard_week1
description: Smart Campus RFID, vi point, cantin va diem danh mo phong
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  camera: 0.12.2
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  socket_io_client: ^3.1.6
  web: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE.txt
  fonts:
    - family: CampusRoboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
